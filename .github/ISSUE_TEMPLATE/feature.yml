name: Feature request
description: 建議已公開專案的新功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 說明使用情境，不要包含公司或客戶內部資訊。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方案
  - type: input
    id: version
    attributes:
      label: 目前使用版本
      placeholder: 例如 v2.3.1
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認
      options:
        - label: 我理解提交建議不代表 Roadmap 或交付日期承諾。
          required: true
